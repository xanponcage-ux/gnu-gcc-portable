  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) == " ") {
            c = c.substring(1);
          }
          if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
          }
        }
        return "";
      }

      function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + exdays * 24 * 60 * 60 * 1000);
        let expires = "expires=" + d.toUTCString();
        document.cookie =
          cname +
          "=" +
          cvalue +
          ";secure;SameSite=Strict;" +
          expires +
          ";path=/";
      }
      window.addEventListener("beforeunload", async (event) => {
        let data = JSON.parse(getCookie("openTabs") || "[]");
        let varRoute = JSON.parse(getCookie("routes") || "[]");
        data = data?.filter((item) => {
          return item !== window.navigation.currentEntry.id;
        });
        if (
          varRoute?.lastIndexOf(
            window.location.href?.slice(window.location.href?.lastIndexOf("/"))
          ) >= 0
        ) {
          varRoute = varRoute?.filter((item, i) => {
            return (
              i !==
              varRoute?.lastIndexOf(
                window.location.href?.slice(
                  window.location.href?.lastIndexOf("/")
                )
              )
            );
          });
        }
        if (data?.length > 0) {
          setCookie("openTabs", JSON.stringify(data));
        }
        setCookie("routes", JSON.stringify(varRoute));
      });
      window.addEventListener("load", async () => {
        let data = JSON.parse(getCookie("openTabs") || "[]");
        let varRoute = JSON.parse(getCookie("routes") || "[]");
        if (
          data?.length === 0 ||
          (data?.length === 1 && data[0] === window.navigation.currentEntry.id)
        ) {
          //need to replace this with your code
          if (
            data?.length === 1 &&
            data[0] === window.navigation.currentEntry.id
          ) {
            // localStorage.setItem("firstTimeLoad", "false");
          } else {
            // localStorage.setItem("firstTimeLoad", "true");
            const tmm_sessionId = localStorage.getItem("tmm_sessionId");
            localStorage.clear();
            localStorage.setItem("tmm_sessionId", tmm_sessionId);
            setCookie("routes", "", 0);
            window.location = "/ldpis_mes/#/";
          }
          data = [];
        } else {
          //need to replace this with your code
          // localStorage.setItem("firstTimeLoad", "false");
        }
        varRoute?.push(
          window.location.href?.slice(window.location.href?.lastIndexOf("/"))
        );
        data?.push(window.navigation.currentEntry.id);
        setCookie("openTabs", JSON.stringify(data));
        setCookie("routes", JSON.stringify(varRoute));
      });
    </script>
